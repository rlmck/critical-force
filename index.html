<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#1a1a1a">
    <title>Critical Force</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 1rem;
            flex-direction: column;
            background: #1a1a1a;
            color: #8a8a8a;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        a { color: #e0e0e0; }
    </style>
    <!-- In the head and run immediately, so the redirect happens
         before anything paints. A flash of this page on the way to
         the real one would be the only thing anybody noticed about
         it. -->
    <script type="module">
      import { preferred, pathFor } from './js/layout.js';
      location.replace(pathFor(preferred()));
    </script>
</head>
<body>
    <!-- Seen only with scripting off, and by anything crawling the
         page. Both versions are one link away either way. -->
    <p>Critical Force</p>
    <p>
        <a href="desktop.html">Desktop version</a> ·
        <a href="mobile.html">Mobile version</a>
    </p>
</body>
</html>
